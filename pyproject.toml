[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
# Keep the test databases between runs; --create-db rebuilds them after a migration.
# Two workers (pytest-xdist, requirements/dev.txt): ~120s instead of ~180s here.
# Not "auto": four workers plus Postgres ran a 12 GB dev machine out of memory.
# `pytest -n0` runs serially, e.g. to debug one test with a breakpoint.
addopts = "--reuse-db -n 2 -m 'not exhaustive'"
markers = [
    # Brute-force proofs of the fare algorithm (apps/fare/tests): they proved it
    # once and are re-run only when it changes -- pricing.py, or the order the
    # device fares API sends things in:  pytest -m exhaustive
    "exhaustive: brute-force proof, skipped by default; run with -m exhaustive",
]
