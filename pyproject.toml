[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
# Keep the test database between runs; --create-db rebuilds it after a migration.
addopts = "--reuse-db"
