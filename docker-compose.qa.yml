# QA deployment. Separate from docker-compose.yml (local dev): no bind mount
# (the image is built with the code baked in, same as it'll run), gunicorn
# instead of runserver, requirements/base.txt instead of dev.txt.
#
# Browsers reach nginx (`proxy`), never gunicorn: only `proxy` publishes a
# port. deploy/nginx/qa.conf says why -- gunicorn's sync workers must not be
# left waiting on browser connections.
#
# Three copies run from this file on the same VPS (docs/deployments.md): `qa`
# (testers, old app builds, ~/byky_django, project byky_f_qa, port 8007),
# `dev` (the dev team, ~/byky_django_dev, project byky_f_dev, port 8008) and
# `live` (~/byky_django_live, project byky_f_live, port 8009). The app image is
# built on GitHub and pulled by deploy/deploy.sh under the name below. Each
# folder's .env picks its port (APP_PORT), workers (GUNICORN_WORKERS) and log
# environment; volumes are prefixed by the project name, so the two never share
# a database. Every default below is qa's.
#
# Run it with an explicit project name -- do NOT rely on the directory name.
# This host already has a compose project called "byky_rms" (a different,
# earlier BYKY project, still running on port 8004) -- an accidental name
# collision would attach to or fight with those containers:
#
#   docker compose -f docker-compose.qa.yml -p byky_f_qa up -d
#
# Port 8007 was picked by checking this host's actual occupied ports first
# (22 53 80 443 5433 8000-8006 8080 8082 were all taken at the time). Confirm
# that's still free before reusing this file for a second environment (e.g.
# production later) -- pick a different port and a different -p name for it.
#
# .env (not committed -- copy .env.qa.example and fill it in) supplies every
# ${VAR} below.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byky_qa}
      POSTGRES_USER: ${POSTGRES_USER:-byky_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
    volumes:
      - byky_f_qa_pgdata:/var/lib/postgresql/data
    # qa / dev: published so a DB client (DBeaver) can log in with the database
    # credentials directly -- owner's decision, 9 Oct 2026. Host port from
    # QA_DB_PUBLIC_PORT in .env (default 5434). live sets
    # QA_DB_PUBLIC_BIND=127.0.0.1: reachable only from the server itself (an SSH
    # tunnel), since a published port bypasses ufw.
    # A one-off psql/pg_dump from the host still works with:
    #   docker compose -f docker-compose.qa.yml -p byky_f_qa exec db psql -U <user> <db>
    ports:
      - "${QA_DB_PUBLIC_BIND:-0.0.0.0}:${QA_DB_PUBLIC_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byky_qa} -d ${POSTGRES_DB:-byky_qa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/base.txt
    # Named, so `worker` and `beat` run the very image deploy.sh just built
    # (`build web`) -- never an older copy of the code.
    image: ${COMPOSE_PROJECT:-byky_f_qa}-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --access-logfile - --error-logfile -
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a real, freshly generated key in .env}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set the VPS IP or QA domain in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Dubai}
      # Plain HTTP for now (IP:port, no domain/cert yet) -- flip to "1" once
      # this is behind real TLS (config/settings.py FORCE_HTTPS).
      DJANGO_FORCE_HTTPS: ${DJANGO_FORCE_HTTPS:-0}
      # One proxy (nginx) in front: trust exactly one X-Forwarded-For entry,
      # the one nginx writes (core/network.py, DRF's throttles).
      DJANGO_NUM_PROXIES: "1"
      DJANGO_COLLECTSTATIC: "1"
      # A copy of each device request for the central log server (the
      # log-ingestion project). Empty = not sent. apps/monitoring/shipper.py.
      LOG_INGEST_URL: ${LOG_INGEST_URL:-}
      LOG_INGEST_KEY: ${LOG_INGEST_KEY:-}
      # Which copy sent a log (qa / dev): the log viewer's qa | dev switch.
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:-}
      POSTGRES_DB: ${POSTGRES_DB:-byky_qa}
      POSTGRES_USER: ${POSTGRES_USER:-byky_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      # Photos are sent by nginx after the app's permission check (qa.conf).
      PHOTO_SERVE: nginx
    volumes:
      # Uploaded files (photos, company logos etc.) must survive a redeploy;
      # static is regenerated by collectstatic on every start, so it gets no
      # volume. MEDIA_HOST_DIR in .env points this at a host folder (the FTP
      # folder, one subfolder per copy -- docs/deployments.md); unset, it is
      # this copy's own named volume.
      - ${MEDIA_HOST_DIR:-byky_f_qa_media}:/app/media
    # No `ports:` -- only `proxy` reaches gunicorn, over the compose network.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The queue for background jobs (photo previews, cleanup). Nothing kept on
  # disk: a lost job is redone by beat's hourly / nightly sweep.
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Celery: the image web was built as, same settings, never migrating
  # (DJANGO_MIGRATE=0, docker/entrypoint.sh).
  worker:
    image: ${COMPOSE_PROJECT:-byky_f_qa}-app
    command: celery -A config worker --concurrency 2 --max-memory-per-child 200000 --loglevel info
    environment: &celery_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a real, freshly generated key in .env}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set the VPS IP or QA domain in .env}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Dubai}
      DJANGO_MIGRATE: "0"
      LOG_INGEST_URL: ${LOG_INGEST_URL:-}
      LOG_INGEST_KEY: ${LOG_INGEST_KEY:-}
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:-}
      POSTGRES_DB: ${POSTGRES_DB:-byky_qa}
      POSTGRES_USER: ${POSTGRES_USER:-byky_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      # Push notifications (apps/notifications): set only when .env names this
      # copy's Firebase key file; unset, nothing is sent.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:+/run/secrets/fcm.json}
    volumes:
      - ${MEDIA_HOST_DIR:-byky_f_qa_media}:/app/media
      # The Firebase service-account key, read-only, only in the worker (it
      # sends the pushes). Unset: an empty stand-in, never read.
      - ${FCM_CREDENTIALS_FILE:-/dev/null}:/run/secrets/fcm.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  beat:
    image: ${COMPOSE_PROJECT:-byky_f_qa}-app
    # The schedule file lives in /tmp: nothing of it needs to survive a restart.
    command: celery -A config beat --schedule /tmp/celerybeat-schedule --loglevel info
    environment: *celery_env
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  # Websockets for pages that update themselves (Rental -> Live Monitoring):
  # the same image, run under uvicorn (config/asgi.py). gunicorn keeps serving
  # every page and API; nginx sends only /ws/ here. web publishes each change
  # through redis (database 1), this passes it on to the open pages.
  realtime:
    image: ${COMPOSE_PROJECT:-byky_f_qa}-app
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --ws-ping-interval 20 --no-access-log
    environment:
      <<: *celery_env
      DJANGO_NUM_PROXIES: "1"
      DJANGO_FORCE_HTTPS: ${DJANGO_FORCE_HTTPS:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped

  proxy:
    image: nginx:1.30-alpine
    volumes:
      - ./deploy/nginx/qa.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only: nginx sends a photo only when the app says so (X-Accel-Redirect).
      - ${MEDIA_HOST_DIR:-byky_f_qa_media}:/media:ro
    ports:
      # qa: the address testers and tablets already use (http://<VPS IP>:8007).
      # dev sets APP_PORT=8008 in its .env.
      # A published port bypasses ufw, as the web port did before.
      - "${APP_PORT:-8007}:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Through nginx to the app, so a proxy that cannot reach web shows as
      # unhealthy. 127.0.0.1 must be in DJANGO_ALLOWED_HOSTS (it already is,
      # for deploy/deploy.sh).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      # One access-log line per request: cap it so it cannot fill the disk.
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  byky_f_qa_pgdata:
  byky_f_qa_media:
