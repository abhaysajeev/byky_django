{% comment %}
  Icon renderer. Prefers inline SVG path data (item.svg) so the sidebar has no
  icon-font dependency; falls back to your existing icon class (item.icon).
{% endcomment %}
{% if item.svg %}
  <svg class="byky-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="{{ item.svg }}"></path>{% if item.svg2 %}<path d="{{ item.svg2 }}"></path>{% endif %}
  </svg>
{% else %}
  <i class="byky-menu-icon {{ item.icon }}"></i>
{% endif %}
