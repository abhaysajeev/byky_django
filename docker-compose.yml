version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byky}
      POSTGRES_USER: ${POSTGRES_USER:-byky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byky}
    volumes:
      - byky_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byky} -d ${POSTGRES_DB:-byky}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    command: python manage.py runserver 0.0.0.0:8000
    # The project is bind-mounted, so anything the container writes keeps the
    # container's ownership on the host. As root that means every file Django
    # generates -- migrations from makemigrations, .pytest_cache, staticfiles --
    # lands root-owned and cannot be edited without sudo. Running as the host
    # user avoids it. Change this if your account is not uid 1000 (`id -u`).
    user: "1000:1000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Dubai}
      POSTGRES_DB: ${POSTGRES_DB:-byky}
      POSTGRES_USER: ${POSTGRES_USER:-byky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byky}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  byky_pgdata:
