# Checks every pull request and every push to main, release/qa and release/live (the
# deployed branches, docs/deployments.md). All are protected: a PR merges only
# when both jobs below are green.
name: CI

on:
  pull_request:
  push:
    branches: [main, release/qa, release/live]

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A slow runner took 18-20 min before the 24 Nov 2026 speed-up; this is
    # only the ceiling, not the expected time.
    timeout-minutes: 30

    # The tests need a real Postgres 16: the schema uses sequences, generated
    # columns and triggers that SQLite does not have.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: byky
          POSTGRES_USER: byky
          POSTGRES_PASSWORD: byky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byky -d byky"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway values for this CI database only -- not secrets.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: byky
      POSTGRES_USER: byky
      POSTGRES_PASSWORD: byky
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: pip install -r requirements/dev.txt

      # A throwaway database: no crash safety needed, so Postgres need not wait
      # for the disk on every commit. Never do this outside CI.
      - name: Fast Postgres for this run only
        env:
          PGPASSWORD: byky
        run: |
          psql -h localhost -U byky -d byky -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
          psql -h localhost -U byky -d byky -Atc "SHOW fsync"
          echo "CPU cores: $(nproc)"

      - name: Lint
        run: ruff check .

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: API schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      # pyproject.toml skips the brute-force proofs and the migration-history
      # tests (-m); one worker per core here (public repo: a 4-core runner).
      - name: Tests
        run: pytest --create-db -n $(nproc)

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The image the VPS runs (docker-compose.qa.yml), built but not pushed
      # anywhere: proves a deploy would build.
      - name: Build the production image
        run: docker build --build-arg REQUIREMENTS=requirements/base.txt -t byky-web:ci .

      # A broken proxy config would otherwise only show up as a failed deploy.
      # Placeholder values: compose refuses to render the file without them.
      - name: The QA compose file and its nginx config are valid
        env:
          DJANGO_SECRET_KEY: ci-only
          DJANGO_ALLOWED_HOSTS: localhost
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose -f docker-compose.qa.yml config --quiet
          docker run --rm -v "$PWD/deploy/nginx/qa.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.30-alpine nginx -t
