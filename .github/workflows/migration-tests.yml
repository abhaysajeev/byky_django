# The data-migration history tests (pytest -m migrations): each rolls the
# database back to an old migration and forward again, so they take minutes
# each. Every migration they guard is applied on dev, qa and live, so they are
# kept out of every push (pyproject.toml) and run here: weekly, and by hand
# from the Actions tab when a migration they cover is touched.
name: Migration tests

on:
  schedule:
    - cron: "30 22 * * 6"        # Saturday 22:30 UTC (Sunday 02:30 Dubai)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: byky
          POSTGRES_USER: byky
          POSTGRES_PASSWORD: byky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byky -d byky"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway values for this CI database only -- not secrets.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: byky
      POSTGRES_USER: byky
      POSTGRES_PASSWORD: byky
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: pip install -r requirements/dev.txt

      - name: Fast Postgres for this run only
        env:
          PGPASSWORD: byky
        run: |
          psql -h localhost -U byky -d byky -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      # -m on the command line replaces pyproject's 'not ... migrations'.
      - name: Migration history tests
        run: pytest --create-db -m migrations -n $(nproc)
