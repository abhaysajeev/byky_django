# nginx in front of gunicorn on the QA VPS (docker-compose.qa.yml, service
# `proxy`). Mounted over the image's /etc/nginx/conf.d/default.conf.
#
# Why it is here: gunicorn's sync workers each serve one connection at a time
# and wait on it until a request arrives. Chrome opens connections ahead of
# need and may leave one unused for up to 60 s; after 30 s gunicorn killed the
# worker waiting on it and wrote "500 Internal Server Error" onto that
# connection, which Chrome then showed as the answer to the user's next click.
# nginx holds idle connections cheaply and hands gunicorn only complete
# requests, one connection each -- so a gunicorn worker never waits on a
# browser.
#
# Plain HTTP on the IP for now. With a domain, this is where TLS goes (listen
# 443 + certificate) and DJANGO_FORCE_HTTPS=1 in .env.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Longer than Chrome's 60 s limit on an unused pre-opened connection, so
    # Chrome always closes it first and nginx never drops one Chrome is about
    # to use.
    client_header_timeout 75s;
    keepalive_timeout 75s;

    # Above the app's own limits (station logo 1 MB, ID documents, photos), so
    # the app answers an oversize file with its own message, not nginx's 413.
    client_max_body_size 10m;

    # Docker's DNS, re-asked every 10 s. Each deploy recreates the web
    # container with a new address; without this nginx would keep the old one
    # and every page would be a 502 until the proxy was restarted too. The
    # variable in proxy_pass is what makes nginx resolve at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    location / {
        proxy_pass $django;

        # The browser's own Host (IP:8007, later the domain): ALLOWED_HOSTS,
        # the CSRF origin check and redirects all depend on it.
        proxy_set_header Host $http_host;
        # Overwritten, never appended: whatever a caller sends in this header
        # is replaced by the address nginx actually saw. core/network.py reads
        # it (DJANGO_NUM_PROXIES=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        # gunicorn gives up on a request after 30 s; wait a little longer so
        # its answer, not nginx's 504, is what comes back.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
