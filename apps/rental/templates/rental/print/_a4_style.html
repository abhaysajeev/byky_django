{% comment %}
Inline, not a static file: a stale cached stylesheet printed the receipt at
its 100mm roll size. The page is tiny; nothing is gained by caching this.
{% endcomment %}
<style>
/* The A4 print of the tax invoice and credit note (client, 22 Nov 2026):
   the very same receipt the preview shows (byky-invoice-receipt.css,
   rental/partials/*_receipt.html) -- no layout of its own -- scaled up to
   fill an A4 page. zoom scales the whole receipt, so every alignment holds.
   Loaded after byky-invoice-receipt.css so this @page wins over its 100mm roll. */

/* No page margin: the browser prints its own header and footer (page title,
   URL, date, page number) in the margin, so with none there is nowhere for
   them to go. The 10mm white border is padding on the page instead, repeated
   on every page of a long bill (box-decoration-break: clone). */
@page { size: A4; margin: 0; }

html, body { margin: 0; padding: 0; background: #ecebf3; }

/* 100mm receipt x 1.9 = 190mm: the A4 width less the 10mm margins. */
.a4-receipt { padding: 12px 0 24px; }
.a4-receipt .bill { zoom: 1.9; box-shadow: 0 1px 3px rgba(26, 22, 64, 0.12); }

.a4-toolbar {
  position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; justify-content: center;
  padding: 10px; background: #fff; border-bottom: 1px solid #e6e4f0;
}

@media print {
  html, body { background: #fff; }
  .a4-receipt { padding: 10mm; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* The receipt's own print rules pin it absolute at 100mm (one roll);
     here it flows, so a long bill continues onto the next A4 page. */
  .a4-receipt .bill {
    position: static; zoom: 1.9; width: 100mm; margin: 0 auto; box-shadow: none;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .a4-receipt .bill-table tr { break-inside: avoid; }
}
</style>
